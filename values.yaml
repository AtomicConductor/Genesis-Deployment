image:
  registry: "junoinnovations"
  repository: "genesis"
  tag: "v6.0.0"
image_pull_secret:                          # Image pull secret to use for the project. This is the name of the secret in the namespace
host:                                       # Hostname to use for the Genesis ingress
pull_policy: Always                         # Pull policy to use for the Genesis image
env: {}                                     # Environment variables to set for the Genesis server
basicAuth:                                  # NextAuth "basic_auth" (email+password) sign-in provider
  enabled: false                            # When true, requires <passwordSecret> with key "password"
  email: ""                                 # Login email (non-secret)
  passwordSecret: genesis-basic-auth        # Secret (key: password) holding the login password
node_selector:                              # Node selector to deploy the Genesis server to
  enable: true                              # Enable node selector
  labels:                                   # Node selector to deploy the Genesis server to
    juno-innovations.com/service: "true"

# Primarily used for Juno-internal development to inject annotations to resources
extra_annotations: {}
genesis_token_creation_extra_annotations: {}


# https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/
# If you run powerful controlplane nodes, you can reuse them to host core Orion services.
tolerations: []

titan:
  tolerations: []
  extra_annotations: []
  image:
    registry: "junoinnovations"
    repository: "titan"
    tag: "v2.1.2"
  owner: bob                                # Owner of the cluster
  email: test@email.com                     # Email for the owner of the cluster
  uid: 1005                                 # UID of the owner of the cluster
  node_selector:                            # Node selector to deploy the Titan server to
    labels:                                 # Node selector to deploy the Titan server to
      juno-innovations.com/service: "true"
  autoscaling:
    min_replicas: 1                         # Minimum number of replicas to run
    max_replicas: 3                         # Maximum number of replicas to run

rhea:
  image:
    registry: "junoinnovations"
    repository: "rhea"
    tag: "v1.2.3"
  env:
    - name: NAMESPACED
      value: "true"                                   # Environment variables to set for Rhea
  resources:
    requests:
      cpu: 200m
      memory: 100Mi
    limits:
      cpu: 350m
      memory: 250Mi

ingressClassName: nginx

# WARP-private exposure (internal-cks). When enabled, the genesis Service is
# labeled/annotated so the central warp-route-reconciler routes <hostname> to its
# ClusterIP over the shared internal-cks Cloudflare Tunnel. Leave disabled to keep
# the chart's upstream behavior unchanged.
warp:
  enabled: false
  hostname: ""                                # e.g. juno.dev.conductor.technology

# In-pod TLS-terminating reverse proxy (nginx). Required for WARP-private exposure
# because Pattern B connects directly to the Service ClusterIP:port -- a single
# port can't path-route, and the app needs / -> :3000 and /socket.io -> :8000
# under one HTTPS origin. When enabled, the genesis Service exposes :443 and a
# proxy sidecar is added to the genesis pod, fronted by a cert-manager cert.
tls:
  enabled: false
  certificate:
    # cert-manager issuer that satisfies the hostname (DNS-01 in CKS).
    issuerRef:
      name: letsencrypt-dns01-prod
      kind: ClusterIssuer
    # Secret cert-manager writes and the proxy mounts.
    secretName: genesis-tls

proxy:
  image: nginx:1.27-alpine

# Helios Linux-VDI workstations (lean, GitOps-managed -- no Titan/Terra/marketplace).
# Each entry renders a Deployment (helios desktop + nginx TLS sidecar), a WARP-labeled
# Service, and a cert-manager Certificate. Reuses image_pull_secret, proxy.image, and
# tls.certificate.issuerRef above. Empty by default so upstream behavior is unchanged.
#
# Entry shape:
#   - name: linux-desktop                 # DNS-safe suffix; resources are helios-<name>
#     hostname: vdi.dev.conductor.technology
#     image: { registry, repository, tag }
#     user: helios                        # desktop user; UID/GID must be free in the image
#     uid: "1200"
#     gid: "1200"
#     gpu: false                          # true adds nvidia.com/gpu: 1 to limits
#     resources:
#       requests: { cpu, memory }
#       limits:   { cpu, memory }
#     password: { secret: <name>, key: password }   # optional OS user password
#     env: [ { name, value } ]            # optional extra Helios env
#     tls: { secretName: <name> }         # optional; defaults to helios-<name>-tls
workstations: []
