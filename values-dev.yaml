# Orion / Genesis -- dev (genesis-dev namespace, WARP-private, TLS).
#
# Deployed by the argocd-internal app-of-apps to the genesis-dev namespace.
# Access is WARP-only at https://juno.dev.conductor.technology:
#   * warp.enabled labels/annotates the genesis Service so the central
#     warp-route-reconciler routes the hostname -> Service ClusterIP.
#   * tls.enabled adds the nginx proxy sidecar (TLS on :443, path-routes
#     / -> :3000 UI and /socket.io -> :8000 backend) fronted by a
#     cert-manager cert from the shared letsencrypt-dns01-prod issuer.
#
# Images are pulled from the internal Zot registry (zot.dev.conductor.technology),
# mirrored from junoinnovations/* and library/nginx -- the CKS nodes have no
# Docker Hub egress. See k8s-services-infra/docs/IMAGE_BUILD_PIPELINE.md s5.
#
# Still required OUTSIDE this chart before traffic flows (infra repo):
#   * cilium-network-policies/values-dev.yaml: a devPolicies entry for
#     genesis-dev allowing ingress fromEntities: cluster on :443 (+ egress
#     the Orion services need: kube-apiserver, image pulls, DNS).
#   * the genesis-dev namespace must carry the cks-netpol=cilium baseline label.
#   * a zot-pull (robot-puller) dockerconfig SealedSecret in genesis-dev.
#   * the juno-auth-secret Secret (key: token) in genesis-dev for NextAuth.

host: ""                                      # unused: ingress is disabled when warp.enabled

# Pull all images from the internal Zot (no Docker Hub egress on the CKS nodes).
image_pull_secret: zot-pull

image:
  registry: zot.dev.conductor.technology/junoinnovations
  # Namespace-parametrized rebuild of upstream genesis:v6.0.0. Upstream ships the
  # backend as a PyInstaller binary that hardcodes the "argocd" namespace for its
  # schema-cache/workload-template calls; -ns1 runs it un-frozen with a shim that
  # redirects that namespace to GENESIS_NAMESPACE (this release's namespace). See
  # INTEGRATION.md "Runbook: namespace-parametrized genesis image".
  tag: v6.0.0-ns4

warp:
  enabled: true
  hostname: juno.dev.conductor.technology

tls:
  enabled: true
  certificate:
    issuerRef:
      name: letsencrypt-dns01-prod
      kind: ClusterIssuer
    secretName: genesis-tls

# nginx proxy sidecar image, mirrored into Zot's library path.
proxy:
  image: zot.dev.conductor.technology/library/nginx:1.27-alpine

env:
  NEXTAUTH_URL: https://juno.dev.conductor.technology
  # NextAuth sits behind the in-pod nginx proxy; trust the X-Forwarded-* headers.
  AUTH_TRUST_HOST: "true"

# Email+password sign-in. Password lives in the genesis-basic-auth Secret (key:
# password), created out-of-band (NOT in git) -- see INTEGRATION.md.
basicAuth:
  enabled: true
  email: admin@conductor.technology
  passwordSecret: genesis-basic-auth

titan:
  image:
    registry: zot.dev.conductor.technology/junoinnovations
  # Cluster owner identity. Titan bootstraps this as a User CRD (metadata.name ==
  # owner) and makes it a member of the "admin" Group at startup -- this is how the
  # sign-in identity gets an authorized backing User (rhea maps the logged-in
  # principal to a User named after the email local-part). MUST stay in sync with
  # basicAuth.email above: owner == local-part(basicAuth.email), i.e.
  # "admin" == local-part("admin@conductor.technology"). Otherwise rhea logs
  # "could not find user: <local-part>" and every genesis/titan call fails with
  # "Internal <service> Error". See INTEGRATION.md "sign-in + authorization".
  owner: admin
  email: admin@conductor.technology
  uid: "1000"

rhea:
  image:
    registry: zot.dev.conductor.technology/junoinnovations

# Helios Linux-VDI workstations. Exposed WARP-only at their own hostnames, same as
# genesis. The image is Juno's Helios (Selkies WebRTC desktop) mirrored into Zot from
# junoinnovations/helios:testing-noble (Ubuntu 24.04 Noble, matches the L40 nodes).
# gpu:false for now -- the L40 nodes are currently saturated by CoreWeave HPC
# node-health-check pods; flip to true once a GPU frees to schedule on nvidia.com/gpu.
workstations:
  - name: linux-desktop
    hostname: vdi.dev.conductor.technology
    image:
      registry: zot.dev.conductor.technology/junoinnovations
      repository: helios
      tag: testing-noble
    user: helios
    uid: "1200"
    gid: "1200"
    gpu: false
    resources:
      requests: { cpu: "1", memory: "2Gi" }
      limits:   { cpu: "4", memory: "6Gi" }
