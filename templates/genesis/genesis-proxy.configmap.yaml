{{- if .Values.tls.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: genesis-proxy
  namespace: {{ .Release.Namespace }}
data:
  nginx.conf: |
    worker_processes auto;
    events { worker_connections 1024; }
    http {
      map $http_upgrade $connection_upgrade { default upgrade; '' close; }

      upstream genesis_ui      { server 127.0.0.1:3000; }
      upstream genesis_backend { server 127.0.0.1:8000; }

      server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /tls/tls.crt;
        ssl_certificate_key /tls/tls.key;

        client_max_body_size 0;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Socket auth subrequest -- mirrors the chart's nginx Ingress annotation
        # nginx.ingress.kubernetes.io/auth-url (.../api/socket-auth/).
        # NOTE: confirm exact semantics/headers with the Juno developers.
        location = /api/socket-auth/ {
          internal;
          proxy_pass http://genesis_ui/api/socket-auth/;
          proxy_pass_request_body off;
          proxy_set_header Content-Length "";
          proxy_set_header Host $host;
          proxy_set_header X-Original-URI $request_uri;
        }

        # Realtime channel -> backend (:8000), gated by the socket auth subrequest.
        location /socket.io {
          auth_request /api/socket-auth/;
          proxy_pass http://genesis_backend;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto https;
        }

        # Everything else -> the Next.js UI (:3000).
        location / {
          proxy_pass http://genesis_ui;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto https;
        }
      }
    }
{{- end }}
