apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}-orion-crds
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Namespace }}-orion-crds
subjects:
  - kind: ServiceAccount
    name: genesis
    namespace: {{ .Release.Namespace }}
  - kind: ServiceAccount
    name: titan
    namespace: {{ .Release.Namespace }}
