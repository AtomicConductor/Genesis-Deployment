{{- if not .Values.warp.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: genesis-ingress
  namespace: {{ .Release.Namespace }}
  annotations:
    nginx.ingress.kubernetes.io/auth-url: "http://genesis.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.ports.ui }}/api/socket-auth/"
spec:
  ingressClassName: {{ .Values.ingressClassName }}
  rules:
    - host: {{ .Values.host }}
      http:
        paths:
          - path: "/"
            pathType: Prefix
            backend:
              service:
                name: genesis
                port:
                  number: {{ .Values.ports.ui }}
          - path: "/socket.io"
            pathType: ImplementationSpecific
            backend:
              service:
                name: genesis
                port:
                  number: {{ .Values.ports.backend }}
{{- end }}