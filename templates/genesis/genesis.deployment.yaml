apiVersion: apps/v1
kind: Deployment
metadata:
  name: genesis
  namespace: {{ .Release.Namespace }}
  labels:
   juno-innovations.com/service-deployment: "genesis"
  annotations:
{{- range $key, $value := .Values.extra_annotations }}
    {{ $key }}: "{{ $value }}"
{{- end }}
spec:
  replicas: 1
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: genesis
  template:
    metadata:
      labels:
        app: genesis
      annotations:
        {{- range $key, $value := .Values.extra_annotations }}
          {{ $key }}: "{{ $value }}"
        {{- end }}
    spec:
      {{- if .Values.tolerations }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      {{- end }}
      serviceAccountName: genesis
      {{- if .Values.image_pull_secret }}
      imagePullSecrets:
        - name: {{ .Values.image_pull_secret }}
      {{- end }}
      {{- if .Values.node_selector.enable }}
      nodeSelector:
        {{- range $key, $value := .Values.node_selector.labels }}
        {{ $key }}: "{{ $value }}"
        {{- end }}
      {{- end }}
      containers:
        - name: genesis
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.pull_policy }}
          env:
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  key: token
                  name: juno-auth-secret
            - name: GALAXY
              value: "Milky Way"
            - name: ICON
              value: "/universe/assets/galaxy-1.webp"
            # Platform namespace Genesis uses for its own resources (schema cache
            # configmaps, tokens, etc.). Upstream defaults this to "argocd" because
            # their Makefile installs Genesis INTO a namespace named argocd. We run
            # Genesis in its own release namespace, so point it there instead of the
            # hardcoded default. Mirrors Orion-Deployment's genesis_namespace value.
            - name: GENESIS_NAMESPACE
              value: {{ .Release.Namespace | quote }}
          {{- if .Values.image_pull_secret }}
            - name: IMAGE_PULL_SECRET
              value: {{ .Values.image_pull_secret }}
          {{- end }}
          {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
          {{- end }}
          ports:
            - containerPort: 3000
              name: frontend
            - containerPort: 8000
              name: backend
        - name: rhea
          image: "{{ .Values.rhea.image.registry }}/{{ .Values.rhea.image.repository }}:{{ .Values.rhea.image.tag }}"
          imagePullPolicy: {{ .Values.pull_policy }}
          env:
          {{- range .Values.rhea.env }}
            - name: {{ .name | quote }}
              value: {{ .value | quote }}
          {{- end }}
          ports:
            - containerPort: 13000
              name: auth
          livenessProbe:
            httpGet:
              path: /.health
              port: 13000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /.health
              port: 13000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.rhea.resources | nindent 12 }}
        {{- if .Values.tls.enabled }}
        - name: proxy
          image: {{ .Values.proxy.image }}
          imagePullPolicy: {{ .Values.pull_policy }}
          ports:
            - containerPort: 443
              name: https
          volumeMounts:
            - name: proxy-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: tls
              mountPath: /tls
              readOnly: true
        {{- end }}
      {{- if .Values.tls.enabled }}
      volumes:
        - name: proxy-config
          configMap:
            name: genesis-proxy
        - name: tls
          secret:
            secretName: {{ .Values.tls.certificate.secretName }}
            # Optional so the pod still starts before cert-manager issues the
            # leaf (self-signed fallback until the real cert lands). See
            # k8s-services-infra STANDARDS.md s6.
            optional: true
      {{- end }}
