# Cluster-scoped access Genesis/Titan genuinely need (Orion is not fully namespaced):
#   * its own CRDs (groups/users/workstations/workstation-logs) are scope: Cluster
#   * Genesis discovers workloads cluster-wide at startup (list services/pods/...).
# This grants full control of the Orion CRDs + READ-ONLY on common resources cluster
# wide -- NOT cluster-admin: no cluster-wide writes to core resources and no cluster
# wide secret access (Genesis writes only within its own namespace, via its Role).
# Name is namespace-prefixed so multiple releases on one cluster don't collide.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-orion-crds
rules:
  - apiGroups: ["juno-innovations.com"]
    resources: ["groups", "users", "workstations", "workstation-logs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # legacy CRD group (kept until upstream drops it)
  - apiGroups: ["junovfx.com"]
    resources: ["groups", "users"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Genesis/Titan discover workloads cluster-wide at startup -- read-only.
  # configmaps is REQUIRED: the compiled Genesis backend's workloads/license
  # discovery calls list_config_map_for_all_namespaces (cluster-scoped). E.g.
  # GET /genesis/license/status -> workloads/service.py:workloads() -> list
  # configmaps across all namespaces. Without this grant that call returns a k8s
  # 403 ("configmaps is forbidden ... at the cluster scope") which the backend
  # surfaces as a 500 -- the red "View N Errors" badge in the UI. Read-only:
  # Genesis can only enumerate configmaps, never mutate them (and never secrets).
  - apiGroups: [""]
    resources: ["services", "pods", "namespaces", "endpoints", "nodes", "persistentvolumeclaims", "persistentvolumes", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  # Genesis builds cluster-scoped storage caches at startup (backend/storage:
  # storage classes + persistent volumes) -- read-only.
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  # Genesis probes for optional CRDs (e.g. kubevirts.kubevirt.io for VM workstations)
  # at startup -- read-only get/list on CRD definitions.
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
