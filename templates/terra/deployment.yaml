apiVersion: apps/v1
kind: Deployment
metadata:
  name: terra
  namespace: {{ .Release.Namespace }}
  labels:
    juno-innovations.com/service-deployment: "terra"
spec:
  revisionHistoryLimit: 0
  replicas: 1
  selector:
    matchLabels:
      app: terra

  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 50%
    type: RollingUpdate

  template:
    metadata:
      annotations:
        # Allow for footprint consolidation
        cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
{{- range $key, $value := .Values.terra.extra_annotations }}
        {{ $key }}: "{{ $value }}"
{{- end }}
      labels:
        app: terra

    spec:
      {{- if .Values.terra.tolerations }}
      tolerations:
        {{- toYaml .Values.terra.tolerations | nindent 8 }}
      {{- end }}
      serviceAccountName: terra
      nodeSelector:
        {{- range $key, $value := .Values.terra.node_selector.labels }}
        {{ $key }}: "{{ $value }}"
        {{- end }}
      {{- if .Values.image_pull_secret }}
      imagePullSecrets:
        - name: {{ .Values.image_pull_secret }}
      {{- end }}
      containers:
        - name: terra
          imagePullPolicy: {{ .Values.pull_policy }}
          image: "{{ .Values.terra.image.registry }}/{{ .Values.terra.image.repository }}:{{ .Values.terra.image.tag }}"
          {{- if .Values.terra.resources }}
          resources:
            {{- if .Values.terra.resources.requests }}
            requests:
              {{- toYaml .Values.terra.resources.requests | nindent 14 }}
            {{- end }}
            {{- if .Values.terra.resources.limits }}
            limits:
              {{- toYaml .Values.terra.resources.limits | nindent 14 }}
            {{- end }}
          {{- end }}
          ports:
            - containerPort: 8000
              name: endpoint
        - name: rhea
          image: "{{ .Values.rhea.image.registry }}/{{ .Values.rhea.image.repository }}:{{ .Values.rhea.image.tag }}"
          imagePullPolicy: {{ .Values.pull_policy }}
          env:
          {{- range .Values.rhea.env }}
            - name: {{ .name | quote }}
              value: {{ .value | quote }}
          {{- end }}
          ports:
            - containerPort: 13000
              name: auth
          livenessProbe:
            httpGet:
              path: /.health
              port: 13000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /.health
              port: 13000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.rhea.resources | nindent 12 }}
